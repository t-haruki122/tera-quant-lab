repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen --offline ruff check
        language: unsupported
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen --offline basedpyright
        language: unsupported
        pass_filenames: false
      - id: check-dependencies
        name: uv.lock and requirements.txt
        entry: uv run --frozen --offline python scripts/check_requirements.py --check-lock
        language: unsupported
        pass_filenames: false
