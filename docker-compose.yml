services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite+aiosqlite:////data/stock_data.db
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
