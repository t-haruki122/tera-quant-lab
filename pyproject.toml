[project]
name = "tera-quant-lab"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "yfinance>=0.2.36",
    "gnews>=0.3.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mcp>=2.3.0",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Existing Japanese documentation and log messages need not be reflowed for lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Depends/Query marker calls to declare dependency injection.
"app/routers/*.py" = ["B008"]
"app/auth.py" = ["B008"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["app", "scripts", "migrations", "tera_mcp"]
venvPath = "."
venv = ".venv"
